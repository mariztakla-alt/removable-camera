<!DOCTYPE html>
<html>

<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Removable Prosthodontics</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
      background: #f7f7f7;
    }

    h2 {
      margin-bottom: 5px;
    }

    input,
    select,
    button {
      width: 90%;
      max-width: 400px;
      padding: 14px;
      margin: 8px;
      font-size: 17px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    video {
      width: 95%;
      max-width: 500px;
      margin-top: 15px;
      border-radius: 12px;
      background: black;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }

    #preview {
      display: none;
      width: 95%;
      max-width: 500px;
      margin: 15px auto;
      border-radius: 12px;
    }

    #submissionBox {
      width: 90%;
      max-width: 400px;
      margin: 25px auto;
      padding: 18px;
      background: white;
      border-radius: 12px;
      box-sizing: border-box;
      text-align: left;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    #submissionBox h3 {
      text-align: center;
      margin-top: 0;
    }

    .stepStatus {
      padding: 10px 5px;
      font-size: 16px;
      border-bottom: 1px solid #eee;
    }

    .stepStatus:last-child {
      border-bottom: none;
    }

    .submitted {
      font-weight: bold;
    }

    .notSubmitted {
      color: #777;
    }

    #duplicateWarning {
      display: none;
      width: 90%;
      max-width: 400px;
      margin: 15px auto;
      padding: 14px;
      box-sizing: border-box;
      border-radius: 8px;
      background: #fff3cd;
      font-weight: bold;
    }

  </style>

</head>


<body>


<h2>Removable Prosthodontics</h2>

<p>Live Photo Verification</p>


<input
  type="text"
  id="studentID"
  placeholder="Enter Student ID"
  autocomplete="off"
>


<select id="step">

  <option value="">
    Select Step
  </option>

  <option value="Primary Impression">
    Primary Impression
  </option>

  <option value="Secondary Impression">
    Secondary Impression
  </option>

  <option value="Metal Try-in">
    Metal Try-in
  </option>

  <option value="Bite Registration">
    Bite Registration
  </option>

  <option value="Try-in">
    Try-in
  </option>

  <option value="Delivery">
    Delivery
  </option>

</select>


<br>


<button
  id="checkStatusButton"
  onclick="checkSubmissionStatus()"
>

  📋 CHECK MY SUBMISSION STATUS

</button>


<div
  id="submissionBox"
  style="display:none;"
>

  <h3>
    Submission Status
  </h3>

  <div id="submissionList"></div>

</div>


<div id="duplicateWarning"></div>


<video
  id="video"
  autoplay
  playsinline
  muted>
</video>


<canvas
  id="canvas"
  style="display:none;">
</canvas>


<img
  id="preview"
>


<br>


<button
  id="takeButton"
  disabled
>

  📸 TAKE PHOTO

</button>


<p id="status">
  Starting camera...
</p>


<script>


// =====================================================
// GOOGLE APPS SCRIPT WEB APP URL
// =====================================================

const SCRIPT_URL =
  "https://script.google.com/a/macros/su.edu.eg/s/AKfycbzB12MPX_m9rjJU-Ja2Fj3HJAxJzcW6Jh97qHXMlc3Dps2f0DhCz9KfL0buqSatC2xI/exec";


// =====================================================
// ELEMENTS
// =====================================================

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const preview =
  document.getElementById("preview");

const takeButton =
  document.getElementById("takeButton");

const status =
  document.getElementById("status");

const submissionBox =
  document.getElementById("submissionBox");

const submissionList =
  document.getElementById("submissionList");

const duplicateWarning =
  document.getElementById("duplicateWarning");


// =====================================================
// VARIABLES
// =====================================================

let cameraReady = false;

let stream = null;

let submittedSteps = [];


// =====================================================
// CAMERA
// =====================================================

async function startCamera() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Camera API is not supported."
      );

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    cameraReady =
      true;


    takeButton.disabled =
      false;


    status.innerText =
      "✅ Camera ready. Take the photo.";


  }

  catch (error) {

    cameraReady =
      false;


    takeButton.disabled =
      true;


    status.innerText =
      "❌ Camera error: " +
      error.name +
      " — " +
      error.message;

  }

}


startCamera();


// =====================================================
// TAKE PHOTO
// =====================================================

takeButton.addEventListener(
  "click",
  takePhoto
);


async function takePhoto() {

  if (!cameraReady) {

    alert(
      "Camera is not ready."
    );

    return;

  }


  const studentID =
    document
      .getElementById("studentID")
      .value
      .trim();


  const step =
    document
      .getElementById("step")
      .value;


  if (!studentID) {

    alert(
      "Please enter your Student ID."
    );

    return;

  }


  if (!step) {

    alert(
      "Please select the step."
    );

    return;

  }


  // ================================================
  // CHECK IF THIS STEP WAS ALREADY SUBMITTED
  // ================================================

  if (
    submittedSteps.includes(step)
  ) {

    showDuplicateWarning(step);

    return;

  }


  if (
    video.videoWidth === 0 ||
    video.videoHeight === 0
  ) {

    alert(
      "Camera image is not available."
    );

    return;

  }


  canvas.width =
    video.videoWidth;


  canvas.height =
    video.videoHeight;


  const context =
    canvas.getContext("2d");


  context.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const imageData =
    canvas.toDataURL(
      "image/jpeg",
      0.90
    );


  const base64 =
    imageData.split(",")[1];


  preview.src =
    imageData;


  preview.style.display =
    "block";


  status.innerText =
    "Uploading...";


  takeButton.disabled =
    true;


  const data = {

    studentID:
      studentID,

    step:
      step,

    photo:
      base64

  };


  try {

    const formData =
      new URLSearchParams();


    formData.append(
      "data",
      JSON.stringify(data)
    );


    await fetch(

      SCRIPT_URL,

      {
        method: "POST",

        mode: "no-cors",

        body: formData
      }

    );


    status.innerText =
      "✅ Photo submitted successfully.";


    takeButton.disabled =
      false;


    // Add the step locally
    // so the student cannot submit it again
    if (
      !submittedSteps.includes(step)
    ) {

      submittedSteps.push(step);

    }


    displaySubmissionStatus(
      submittedSteps
    );


  }

  catch (error) {

    status.innerText =
      "❌ Upload failed: " +
      error.message;


    takeButton.disabled =
      false;

  }

}


// =====================================================
// CHECK SUBMISSION STATUS
// =====================================================

function checkSubmissionStatus() {


  const studentID =
    document
      .getElementById("studentID")
      .value
      .trim();


  if (!studentID) {

    alert(
      "Please enter your Student ID first."
    );

    return;

  }


  submissionBox.style.display =
    "block";


  submissionList.innerHTML =
    "<p>Checking your submissions...</p>";


  duplicateWarning.style.display =
    "none";


  const callbackName =
    "statusCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {


      try {

        if (result.error) {

          submissionList.innerHTML =
            "<p>❌ " +
            result.error +
            "</p>";

          return;

        }


        submittedSteps =
          result.submittedSteps || [];


        displaySubmissionStatus(
          submittedSteps
        );


      }

      finally {

        delete window[callbackName];

      }

    };


  const script =
    document.createElement("script");


  script.src =
    SCRIPT_URL +
    "?studentID=" +
    encodeURIComponent(studentID) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      submissionList.innerHTML =
        "<p>❌ Could not check submission status.</p>";

      delete window[callbackName];

    };


  document.body.appendChild(
    script
  );

}


// =====================================================
// DISPLAY STATUS
// =====================================================

function displaySubmissionStatus(
  submittedSteps
) {


  const steps = [

    "Primary Impression",

    "Secondary Impression",

    "Metal Try-in",

    "Bite Registration",

    "Try-in",

    "Delivery"

  ];


  let html = "";


  steps.forEach(
    function(step) {


      if (
        submittedSteps.includes(step)
      ) {

        html +=
          '<div class="stepStatus submitted">' +
          '✅ ' +
          step +
          '</div>';

      }

      else {

        html +=
          '<div class="stepStatus notSubmitted">' +
          '⬜ ' +
          step +
          '</div>';

      }

    }
  );


  submissionList.innerHTML =
    html;

}


// =====================================================
// DUPLICATE WARNING
// =====================================================

function showDuplicateWarning(step) {

  duplicateWarning.innerText =
    "⚠️ " +
    step +
    " has already been submitted. " +
    "You cannot submit this step again.";

  duplicateWarning.style.display =
    "block";

  status.innerText =
    "This step has already been submitted.";

}


// =====================================================
// HIDE WARNING WHEN STEP CHANGES
// =====================================================

document
  .getElementById("step")
  .addEventListener(
    "change",
    function() {

      duplicateWarning.style.display =
        "none";

    }
  );


</script>


</body>

</html>
